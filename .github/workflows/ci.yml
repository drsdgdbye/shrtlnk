name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-and-push:
    needs: build-and-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    needs: build-and-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose file to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VDS_USER@$VDS_HOST" 'mkdir -p ~/shrtlnk'
          scp -i ~/.ssh/id_ed25519 docker-compose.yml "$VDS_USER@$VDS_HOST:~/shrtlnk/docker-compose.yml"

      - name: Write .env on VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SHORT_URL_BASE: ${{ secrets.SHORT_URL_BASE }}
          SHRTLNK_IMAGE: ${{ env.IMAGE }}
          # Значение публикации порта приходит из repository variable; безопасный дефолт — 127.0.0.1:8080:8080.
          HTTP_PUBLISH: ${{ vars.HTTP_PUBLISH || '127.0.0.1:8080:8080' }}
        run: |
          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'SHORT_URL_BASE=%s\n' "$SHORT_URL_BASE"
            printf 'HTTP_PUBLISH=%s\n' "$HTTP_PUBLISH"
            printf 'SHRTLNK_IMAGE=%s\n' "$SHRTLNK_IMAGE"
          } | ssh -i ~/.ssh/id_ed25519 "$VDS_USER@$VDS_HOST" \
            'umask 077; mkdir -p ~/shrtlnk; cat > ~/shrtlnk/.env; chmod 600 ~/shrtlnk/.env'

      - name: Log in to GHCR and deploy
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 "$VDS_USER@$VDS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/id_ed25519 "$VDS_USER@$VDS_HOST" \
            'cd ~/shrtlnk && docker compose pull && docker compose up -d'
