services:
  shrtlnk:
    image: ${SHRTLNK_IMAGE:-shrtlnk:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATA_FILE: /data/links.db
    ports:
      - "${HTTP_PUBLISH:-8080:8080}"
    volumes:
      - shrtlnk-data:/data

volumes:
  shrtlnk-data:
